name: EsimCard Android

# Builds the EsimCard APK (Android only) from this fork.
# Signed with the public NekokoLPA2 community key (SHA-1 C47350C7...AD73):
# its hash is in the ARA-M of EsimCard chips, so OMAPI access works.
# No secrets needed.
on:
  workflow_dispatch:
  push:
    branches: [esimcard, esimcard-test]
    tags: ['esimcard-v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.47.2
  CARGOKIT_TOOLCHAIN: 1.99.1
  NDK_VERSION: 28.2.13676358

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' "ndk;${NDK_VERSION}" >/dev/null

      - name: Rust toolchain
        run: |
          rustup toolchain install "$CARGOKIT_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$CARGOKIT_TOOLCHAIN" \
            aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - run: flutter pub get --enforce-lockfile

      - name: Build APK
        run: |
          flutter build apk --release --flavor community --target lib/main.dart \
            --split-per-abi --target-platform android-arm,android-arm64 \
            --dart-define=APP_VARIANT=community \
            --dart-define=GM_PSK_URL=https://key.9esim.com/psk

      - name: Verify signature and package
        run: |
          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          mkdir -p dist
          for ABI in arm64-v8a armeabi-v7a; do
            APK="build/app/outputs/flutter-apk/app-${ABI}-community-release.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee signer.txt
            grep -qi "c47350c7ba682b34a3e584a0d58463ea42b1ad73" signer.txt || \
              { echo "::error::$APK is not signed with the community key expected by the chips' ARA-M"; exit 1; }
            cp "$APK" "dist/EsimCard-${VERSION//+/-}-${ABI}.apk"
          done
          ls -la dist
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: EsimCard-android
          path: dist/*
          if-no-files-found: error

      - name: GitHub pre-release (test branch)
        if: github.ref == 'refs/heads/esimcard-test'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="esimcard-test-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" dist/* --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "EsimCard — тестовая сборка #${GITHUB_RUN_NUMBER} (диагностика)" \
            --notes "Тестовая сборка: Настройки → О приложении → «Привилегии оператора». Не для RuStore."

      - name: GitHub release
        if: github.ref == 'refs/heads/esimcard' || startsWith(github.ref, 'refs/tags/esimcard-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          TAG="esimcard-v${VERSION//+/-}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete-asset "$TAG" "EsimCard-${VERSION//+/-}.apk" -y 2>/dev/null || true
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --latest \
              --title "EsimCard ${VERSION}" \
              --notes "EsimCard для Android. Основано на NekokoLPA2 (MIT)."
          fi
